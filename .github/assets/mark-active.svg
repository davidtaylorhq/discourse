<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" role="img" aria-label="in progress">
  <!-- Circumference is 37.7, so 28 on and 9.7 off leaves a quarter open. -->
  <circle cx="8" cy="8" r="6" fill="none" stroke="#d4791d" stroke-width="1.5"
          stroke-linecap="round" stroke-dasharray="28 9.7">
    <animateTransform attributeName="transform" type="rotate"
                      from="0 8 8" to="360 8 8" dur="1.1s" repeatCount="indefinite"/>
  </circle>
</svg>
