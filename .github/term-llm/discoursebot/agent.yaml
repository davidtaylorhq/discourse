name: discoursebot
description: "Answers GitHub comments, reviews code, and authors changes"
time_grounding: true
agents_md: "true"
skills: "all"

tools:
  enabled: [read_file, glob, grep, write_file, edit_file, shell]

mcp:
  - name: github

shell:
  allow:
    - "pwd"
    # Nothing that executes runs here. git included: with a writable git
    # directory, `diff.external`, `textconv`, `core.fsmonitor` and a hook all
    # turn an ordinary git command into code running on the runner.
    - "sandbox *"
  auto_run: true
  scripts:
    changes: "sandbox git status --porcelain=v1 && sandbox git diff"

max_turns: 200
handover_mode: "light"
