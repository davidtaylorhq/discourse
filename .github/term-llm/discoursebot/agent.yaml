name: discoursebot
description: "Answers GitHub comments, reviews code, and authors changes"
time_grounding: true

# The sandbox holds no credentials, nothing is mounted from the runner, and it
# is thrown away with the run. There is nothing in here to protect from the
# agent, so it works without approvals.
agents_md: "true"
skills: "all"

tools:
  enabled: [read_file, glob, grep, write_file, edit_file, shell]

mcp:
  - name: github

shell:
  auto_run: true

max_turns: 200
handover_mode: "light"
