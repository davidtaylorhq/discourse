name: discoursebot
description: "Answers GitHub comments, reviews code, and authors changes"
time_grounding: true
agents_md: "true"
skills: "all"

tools:
  enabled: [read_file, glob, grep, write_file, edit_file, shell]

mcp:
  - name: github

shell:
  allow:
    - "pwd"
    - "git diff *"
    - "git log *"
    - "git status"
    - "git show *"
    - "git blame *"
    - "git rev-parse *"
    - "git add *"
    - "git commit *"
    - "git restore *"
    # Everything that executes runs in the dev container. `docker` itself is
    # deliberately absent: its flags would reach back out to the runner.
    - "sandbox *"
  auto_run: true
  scripts:
    pr-head-sha: "git rev-parse HEAD"

max_turns: 200
handover_mode: "light"
