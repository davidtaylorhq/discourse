name: discoursebot
description: "Answers GitHub comments and posts its own review feedback"
time_grounding: true
agents_md: "true"
skills: "all"

tools:
  enabled: [read_file, glob, grep, shell]

mcp:
  - name: github

shell:
  allow:
    - "pwd"
    - "git diff *"
    - "git log *"
    - "git status"
    - "git show *"
    - "git blame *"
    - "git merge-base *"
    - "git rev-parse *"
  auto_run: true
  scripts:
    pr-head-sha: "git rev-parse HEAD"
    pr-changed-files: "git diff --name-only $(git merge-base HEAD origin/main)...HEAD"

max_turns: 200
handover_mode: "light"
