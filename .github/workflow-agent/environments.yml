environments:
  - name: discourse_dev
    description: >-
      The Discourse development environment: Ruby, node, postgres and redis.
      No dependency installation or database preparation runs automatically.
      Use existing tools first. If a chosen command needs missing Ruby gems,
      run bundle install; if it needs JavaScript dependencies, run
      pnpm install --frozen-lockfile. Only prepare a database when the command
      needs it: wait for pg_isready, then use RAILS_ENV=test bin/rake
      db:create db:migrate for specs, or the development database for a Rails
      console. Skip installs and migrations that the task does not need.
    image: discourse/discourse_dev:release
    cmd: /sbin/boot
    user: discourse
    mount: /src
