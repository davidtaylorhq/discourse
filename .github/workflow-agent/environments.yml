environments:
  - name: discourse_dev
    description: >-
      The Discourse development environment: Ruby, node, postgres and redis.
      Specs, rubocop, prettier, lint, migrations and the rails console.
    image: discourse/discourse_dev:release
    cmd: /sbin/boot
    user: discourse
    mount: /src
    setup: |
      for _ in $(seq 1 60); do pg_isready -q && break; sleep 2; done
      bundle install --jobs "$(nproc)" --retry 3
      pnpm install --frozen-lockfile
      bin/rake db:create db:migrate
      RAILS_ENV=test bin/rake db:create db:migrate
