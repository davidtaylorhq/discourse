# The caller that runs @discoursebot on davidtaylorhq/discourse.
name: Discoursebot

on:
  issue_comment:
    types: [created]

jobs:
  respond:
    # Without this every comment in the repository starts a runner. The
    # backport bot answers to the same name and is not this one.
    if: |
      contains(github.event.comment.body, '@discoursebot') &&
      !contains(github.event.comment.body, '@discoursebot backport')
    uses: davidtaylorhq/workflow-agent/.github/workflows/agent.yml@main
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      checks: read
      statuses: read
    with:
      mention: '@discoursebot'
      provider: claude-bin:opus
      instructions: .github/workflow-agent/instructions.md
    secrets:
      app-id: ${{ secrets.DISCOURSEBOT_APP_ID }}
      app-private-key: ${{ secrets.DISCOURSEBOT_APP_PRIVATE_KEY }}
      provider-env: |
        CLAUDE_CODE_OAUTH_TOKEN=${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
