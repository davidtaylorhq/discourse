name: Bot attachment smoke test

on:
  workflow_dispatch:

permissions: {}

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ secrets.DISCOURSEBOT_APP_ID }}
          private-key: ${{ secrets.DISCOURSEBOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Install GitHub CLI with attachment support
        run: |
          curl -fsSL https://github.com/cli/cli/releases/download/v2.100.0/gh_2.100.0_linux_amd64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_2.100.0_linux_amd64/bin" >> "$GITHUB_PATH"

      - name: Create test image
        working-directory: ${{ runner.temp }}
        run: |
          python3 - <<'PY'
          import struct
          import zlib
          from pathlib import Path

          def chunk(kind, data):
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', zlib.crc32(kind + data))

          width, height = 160, 60
          rows = b''.join(b'\0' + bytes((40, 120, 210) if y < 30 else (80, 180, 120)) * width for y in range(height))
          png = b'\x89PNG\r\n\x1a\n'
          png += chunk(b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 2, 0, 0, 0))
          png += chunk(b'IDAT', zlib.compress(rows)) + chunk(b'IEND', b'')
          Path('attachment-test.png').write_bytes(png)
          Path('comment.md').write_text('Attachment upload test using the Discoursebot GitHub App installation token.\n\n![Blue and green test image](attachment-test.png)\n')
          PY

      - name: Upload and comment using the installation token
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh --version
          gh pr comment 328 --body-file comment.md --attach attachment-test.png
