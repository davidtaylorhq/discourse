name: Bot attachment smoke test

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ secrets.DISCOURSEBOT_APP_ID }}
          private-key: ${{ secrets.DISCOURSEBOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Try direct image uploads with both installation tokens
        env:
          ACTIONS_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
          REPOSITORY_ID: ${{ github.event.repository.id }}
        working-directory: ${{ runner.temp }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import struct
          import subprocess
          import urllib.parse
          import zlib
          from pathlib import Path

          def chunk(kind, data):
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', zlib.crc32(kind + data))

          width, height = 160, 60
          rows = b''.join(b'\0' + bytes((40, 120, 210) if y < 30 else (80, 180, 120)) * width for y in range(height))
          png = b'\x89PNG\r\n\x1a\n'
          png += chunk(b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 2, 0, 0, 0))
          png += chunk(b'IDAT', zlib.compress(rows)) + chunk(b'IEND', b'')
          Path('attachment-test.png').write_bytes(png)

          for label in ('ACTIONS_TOKEN', 'APP_TOKEN'):
              query = urllib.parse.urlencode({
                  'name': f'{label.lower()}-attachment-test.png',
                  'content_type': 'image/png',
                  'repository_id': os.environ['REPOSITORY_ID'],
              })
              response_file = f'{label}.json'
              result = subprocess.run([
                  'curl', '--silent', '--show-error', '--max-time', '30',
                  '--request', 'POST', '--output', response_file,
                  '--write-out', '%{http_code}',
                  '--header', f"Authorization: token {os.environ[label]}",
                  '--header', 'Accept: application/vnd.github+json',
                  '--header', 'Content-Type: application/octet-stream',
                  '--data-binary', '@attachment-test.png',
                  f'https://uploads.github.com/user-attachments/assets?{query}',
              ], capture_output=True, text=True)
              body = Path(response_file).read_text() if Path(response_file).exists() else ''
              print(f'{label}: HTTP {result.stdout}, curl exit {result.returncode}')
              print(body[:2000])
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write(f'### {label}\n\nHTTP {result.stdout}; curl exit {result.returncode}\n\n```text\n{body[:2000]}\n```\n\n')
              if result.stdout == '201':
                  url = json.loads(body).get('url')
                  if url:
                      with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                          summary.write(f'![Uploaded test image]({url})\n\n')
          PY
