name: Bot attachment smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ secrets.DISCOURSEBOT_APP_ID }}
          private-key: ${{ secrets.DISCOURSEBOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write

      - name: Post uploaded image with App token
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import struct
          import urllib.error
          import urllib.parse
          import urllib.request
          import zlib
          
          
          def request(url, token, data=None, content_type='application/json'):
              req = urllib.request.Request(url, data=data, headers={
                  'Authorization': f'token {token}',
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': content_type,
                  'User-Agent': 'workflow-agent-attachment-test',
              })
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      print(f'HTTP {response.status}')
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  print(f'HTTP {error.code}')
                  for name in ('X-Accepted-GitHub-Permissions', 'X-Accepted-OAuth-Scopes'):
                      print(f'{name}: {error.headers.get(name, "not supplied")}')
                  print(error.read().decode()[:2000])
                  raise SystemExit(1)
          
          
          def chunk(kind, data):
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', zlib.crc32(kind + data))
          
          
          url = 'https://github.com/user-attachments/assets/ee8803bc-093e-46a5-8d16-f0c97936fe7a'
          body = f'Image upload test: uploaded against `workflow-agent-assets` using a repository-scoped PAT; this comment was posted using the bot’s App token.\n\n![Cross-repository upload test: blue and green bands]({url})'
          comment = request('https://api.github.com/repos/davidtaylorhq/discourse/issues/328/comments', os.environ['APP_TOKEN'], json.dumps({'body': body}).encode())
          print(f'Comment: {comment["html_url"]}')
          print(f'Author: {comment["user"]["login"]}')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'{body}\n\n[Bot comment]({comment["html_url"]})\n')
          PY
