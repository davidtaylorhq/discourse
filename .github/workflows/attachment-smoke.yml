name: Bot attachment smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ secrets.DISCOURSEBOT_APP_ID }}
          private-key: ${{ secrets.DISCOURSEBOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write

      - name: Upload with PAT and post with App token
        env:
          UPLOAD_TOKEN: ${{ secrets.ATTACHMENT_UPLOAD_TOKEN }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          python3 - <<'PY'
          import io
          import zipfile
          import json
          import os
          import struct
          import urllib.error
          import urllib.parse
          import urllib.request
          import zlib
          
          
          def request(url, token, data=None, content_type='application/json'):
              req = urllib.request.Request(url, data=data, headers={
                  'Authorization': f'token {token}',
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': content_type,
                  'User-Agent': 'workflow-agent-attachment-test',
              })
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      print(f'HTTP {response.status}')
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  print(f'HTTP {error.code}')
                  for name in ('X-Accepted-GitHub-Permissions', 'X-Accepted-OAuth-Scopes'):
                      print(f'{name}: {error.headers.get(name, "not supplied")}')
                  print(error.read().decode()[:2000])
                  raise SystemExit(1)
          
          
          def chunk(kind, data):
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', zlib.crc32(kind + data))
          
          
          pat = os.environ['UPLOAD_TOKEN']
          if not pat:
              raise SystemExit('ATTACHMENT_UPLOAD_TOKEN is missing')
          repo = request('https://api.github.com/repos/davidtaylorhq/workflow-agent-assets', pat)
          sample = 'https://demo.playwright.dev/reports/todomvc/data/e6099cadf79aa753d5500aa9508f9d1dbd87b5ee.zip'
          with urllib.request.urlopen(sample, timeout=60) as response:
              trace = response.read()
          assert zipfile.is_zipfile(io.BytesIO(trace)), 'Sample is not a ZIP'
          print(f'Testing a real Playwright trace ZIP: {len(trace)} bytes')
          query = urllib.parse.urlencode({
              'name': 'playwright-trace-test.zip',
              'content_type': 'application/zip',
              'repository_id': repo['id'],
          })
          asset = request(f'https://uploads.github.com/user-attachments/assets?{query}', pat, trace, 'application/octet-stream')
          print(json.dumps(asset))
          url = asset['url']
          assert url.startswith('https://github.com/user-attachments/'), 'Unexpected URL'
          viewer = 'https://trace.playwright.dev/?trace=' + urllib.parse.quote(url, safe='')
          body = f'Trace upload test using the public Playwright TodoMVC demo trace.\n\n[Download trace ZIP]({url}) · [Open trace viewer]({viewer})'
          
          comment = request('https://api.github.com/repos/davidtaylorhq/discourse/issues/328/comments', os.environ['APP_TOKEN'], json.dumps({'body': body}).encode())
          print(f'Comment: {comment["html_url"]}')
          print(f'Author: {comment["user"]["login"]}')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'{body}\n\n[Bot comment]({comment["html_url"]})\n')
          PY
