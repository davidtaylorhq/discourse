name: Backport

on:
  issue_comment:
    types: [created]

jobs:
  backport:
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@discoursebot backport') &&
      (
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) ||
        github.event.comment.user.login == 'patch-triage[bot]'
      )
    outputs:
      conflicts: ${{ steps.backport.outputs.conflicts }}
      conflict_versions: ${{ steps.backport.outputs.conflict_versions }}
      result_url: ${{ steps.backport.outputs.result_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}

    steps:
      - name: Create Discoursebot token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.DISCOURSEBOT_APP_ID }}
          private-key: ${{ secrets.DISCOURSEBOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Add reaction to comment
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          gh api \
            --method POST \
            /repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions \
            -f content='+1'

      - name: Post start comment
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          gh pr comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body "Backport started. [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: Configure Git
        run: |
          git config --global user.name "Discourse CI"
          git config --global user.email "ci@ci.invalid"

      - name: Perform backport
        id: backport
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: ruby script/backport.rb

  resolve-conflicts:
    needs: backport
    if: needs.backport.outputs.conflicts == 'true'
    uses: davidtaylorhq/workflow-agent/.github/workflows/agent.yml@main
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      checks: read
      statuses: read
    with:
      mention: '@discoursebot'
      provider: claude-bin:opus
      instructions: .github/workflow-agent/instructions.md
      allowed-branches: 'backport/[0-9]+\.[0-9]+/${{ github.event.issue.number }}'
      task: >-
        Resolve the cherry-pick conflicts for versions ${{ needs.backport.outputs.conflict_versions }}
        from this backport request. Read the full results at ${{ needs.backport.outputs.result_url }}
        for the target branches and commits. Leave successful backports alone.
        Reproduce each failed cherry-pick on its release branch, resolve the conflicts,
        and push the backport branch. Run targeted checks only when the resolution
        is likely to introduce a problem; skip routine tests and lint for straightforward
        backports that preserve the original behavior. Use open_pull_request to
        open its PR against the release branch. Summarize the results on the original PR.
    secrets:
      app-id: ${{ secrets.DISCOURSEBOT_APP_ID }}
      app-private-key: ${{ secrets.DISCOURSEBOT_APP_PRIVATE_KEY }}
      provider-env: |
        CLAUDE_CODE_OAUTH_TOKEN=${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
